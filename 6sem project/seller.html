<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Seller Shop</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
    <a class="brand" href="index.html">CraftNext</a>
    <a href="index.html">← Home</a>
</header>

<section>

    <!-- SELLER HEADER -->
    <div class="seller-header">
        <img id="sellerImg" class="seller-avatar">
        <div>
            <h2 id="sellerName"></h2>
            <p>Handmade artisan shop</p>
        </div>
    </div>

    <h3>Products by Seller</h3>

    <div class="product-grid" id="sellerProducts"></div>

</section>

<div class="floating-cart" onclick="location.href='cart.html'">
 🛒 <span id="cartCount">0</span>
</div>

<script src="script.js"></script>

<script>

/* ===== MASTER PRODUCT DB ===== */

const products = [
{
id:0,
name:"Krishna Painting",
price:499,
seller:"Archana Rana",
img:"img/krishna.jpg"
},
{
id:1,
name:"Lippan Art",
price:499,
seller:"Archana Rana",
img:"img/lippan.jpg"
},
{
id:2,
name:"Mandala Clock",
price:599,
seller:"Other Artist",
img:"img/clock.jpg"
}
];


/* ===== GET SELLER FROM URL ===== */

const seller = new URLSearchParams(location.search).get("seller");


/* ===== SET HEADER ===== */

document.getElementById("sellerName").innerText = seller;
document.getElementById("sellerImg").src = "img/seller.jpg"; // placeholder


/* ===== FILTER ===== */

const list = products.filter(p => p.seller === seller);

function addSellerProduct(id){
  const p = products.find(x => x.id === id);
  addToCart(p);
}


/* ===== RENDER ===== */

const box = document.getElementById("sellerProducts");

list.forEach(p => {

box.innerHTML += `
<div class="product-card">

<a href="product.html?id=${p.id}" class="card-link">
<img src="${p.img}">
</a>

<h4>
<a href="product.html?id=${p.id}" class="card-link">
${p.name}
</a>
</h4>

<p>By ${p.seller}</p>
<span class="price">₹${p.price}</span>

<button onclick="addSellerProduct(${p.id})">Add to Cart</button>


</div>
`;

});

</script>

</body>
</html>
