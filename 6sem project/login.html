<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login - CraftNest</title>
<link rel="stylesheet" href="style.css">

<style>

/* LOGIN PAGE */

.login-page{
display:flex;
justify-content:center;
align-items:center;
height:80vh;
}

/* LOGIN CARD */

.login-box{
background:white;
padding:40px;
width:350px;
border-radius:12px;
box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

.login-box h2{
text-align:center;
margin-bottom:25px;
}

/* INPUTS */

.login-box input{
width:100%;
padding:12px;
margin-bottom:15px;
border-radius:6px;
border:1px solid #ccc;
font-size:14px;
}

/* BUTTON */

.login-btn{
width:100%;
padding:12px;
background:#d97745;
border:none;
color:white;
font-size:16px;
border-radius:6px;
cursor:pointer;
}

.login-btn:hover{
background:#c56535;
}

/* REGISTER LINK */

.register-link{
text-align:center;
margin-top:15px;
font-size:14px;
}

.register-link a{
color:#d97745;
text-decoration:none;
}

</style>
</head>


<body>

<header class="navbar">
<a class="brand" href="index.html">CraftNext</a>
<a href="index.html" class="back-btn">← Back to Home</a>
</header>


<section class="login-page">

<div class="login-box">

<h2>Login</h2>

<input type="email" placeholder="Email">

<input type="password" placeholder="Password">

<button class="login-btn">Login</button>

<div class="register-link">
Don't have an account?
<a href="#">Register</a>
</div>

</div>

</section>

</body>
</html>
